name: AX8 PRO · Source checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-checks.yml'
      - 'scripts/**'
      - 'tools/**'
      - 'release_notes/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/source-checks.yml'
      - 'scripts/**'
      - 'tools/**'
      - 'release_notes/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tools
      - name: Test OTA manifest and release history
        run: python -m unittest discover -s tools -p 'test_*.py' -v
