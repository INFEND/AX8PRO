name: AX8 PRO · Source checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-checks.yml'
      - 'scripts/**'
      - 'tools/**'
      - 'release_notes/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  pull_request:
    paths:
      - '.github/workflows/source-checks.yml'
      - 'scripts/**'
      - 'tools/**'
      - 'release_notes/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test automatic monitoring logic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ax8-auto-test
          javac -d /tmp/ax8-auto-test \
            app/src/main/java/ru/xarkon/ax8/AutoPollController.java \
            app/src/main/java/ru/xarkon/ax8/RouterEndpointConfig.java \
            app/src/main/java/ru/xarkon/ax8/RefreshSession.java \
            app/src/main/java/ru/xarkon/ax8/ForegroundHandoff.java \
            app/src/main/java/ru/xarkon/ax8/RouterOperationGate.java \
            app/src/main/java/ru/xarkon/ax8/ClientSnapshotPolicy.java \
            app/src/main/java/ru/xarkon/ax8/BackgroundSummary.java \
            app/src/main/java/ru/xarkon/ax8/SmsAlertPlanner.java \
            app/src/main/java/ru/xarkon/ax8/TelnetReadPolicy.java \
            app/src/main/java/ru/xarkon/ax8/RetryBackoff.java \
            app/src/main/java/ru/xarkon/ax8/QosRecoveryPolicy.java \
            app/src/main/java/ru/xarkon/ax8/QosResyncPolicy.java \
            app/src/main/java/ru/xarkon/ax8/BatteryLevelPolicy.java \
            app/src/main/java/ru/xarkon/ax8/ReleaseNotes.java \
            app/src/main/java/ru/xarkon/ax8/OtaHistory.java \
            app/src/main/java/ru/xarkon/ax8/JobRunGuard.java \
            app/src/main/java/ru/xarkon/ax8/BackgroundCommandPolicy.java \
            app/src/main/java/ru/xarkon/ax8/BackgroundTickPolicy.java \
            app/src/main/java/ru/xarkon/ax8/InternetStatusPolicy.java \
            tools/AutoPollControllerTest.java \
            tools/RouterEndpointConfigTest.java \
            tools/RefreshSessionTest.java \
            tools/ForegroundHandoffTest.java \
            tools/RouterOperationGateTest.java \
            tools/ClientSnapshotPolicyTest.java \
            tools/BackgroundSummaryTest.java \
            tools/SmsAlertPlannerTest.java \
            tools/TelnetReadPolicyTest.java \
            tools/RetryBackoffTest.java \
            tools/QosRecoveryPolicyTest.java \
            tools/QosResyncPolicyTest.java \
            tools/BatteryLevelPolicyTest.java \
            tools/OtaHistoryTest.java \
            tools/JobRunGuardTest.java \
            tools/BackgroundCommandPolicyTest.java \
            tools/BackgroundTickPolicyTest.java \
            tools/InternetStatusPolicyTest.java
          java -cp /tmp/ax8-auto-test AutoPollControllerTest
          java -cp /tmp/ax8-auto-test RouterEndpointConfigTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.RefreshSessionTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.ForegroundHandoffTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.RouterOperationGateTest
          java -cp /tmp/ax8-auto-test ClientSnapshotPolicyTest
          java -cp /tmp/ax8-auto-test BackgroundSummaryTest
          java -cp /tmp/ax8-auto-test SmsAlertPlannerTest
          java -cp /tmp/ax8-auto-test TelnetReadPolicyTest
          java -cp /tmp/ax8-auto-test RetryBackoffTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.QosRecoveryPolicyTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.QosResyncPolicyTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.BatteryLevelPolicyTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.OtaHistoryTest
          java -cp /tmp/ax8-auto-test JobRunGuardTest
          java -cp /tmp/ax8-auto-test BackgroundCommandPolicyTest
          java -cp /tmp/ax8-auto-test BackgroundTickPolicyTest
          java -cp /tmp/ax8-auto-test ru.xarkon.ax8.InternetStatusPolicyTest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m compileall -q scripts tools
      - name: Test OTA manifest and release history
        run: python -m unittest discover -s tools -p 'test_*.py' -v

  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform
        shell: bash
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Compile Android debug APK without release signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew && -f gradle/wrapper/gradle-wrapper.jar ]]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - name: Android lint static analysis
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f gradlew && -f gradle/wrapper/gradle-wrapper.jar ]]; then
            ./gradlew --no-daemon :app:lintDebug
          else
            gradle --no-daemon :app:lintDebug
          fi
      - name: Preserve Android lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax8pro-android-lint
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
