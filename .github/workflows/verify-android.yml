name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid stale verification runs competing for runner time on rapid pushes.
concurrency:
  group: android-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Python regression checks
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee python-regressions.log
      - name: Compile debug APK
        id: android_build
        # Compile even if Python regressions fail, but respect cancellation.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug 2>&1 | tee android-build.log
      - name: Validate debug APK identity and archive
        id: apk_validation
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -t "$apk" > apk-integrity.log
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > apk-badging.log
          grep -q "^package: name='ru.xarkon.ax8pro' " apk-badging.log
          # A structurally valid APK may still be unsigned or have a broken signature.
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk" > apk-signature.log 2>&1
      - name: Android lint
        # Lint independently, including when compilation or Python checks fail.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:lintDebug 2>&1 | tee android-lint.log
      - name: Preserve debug APK for verification
        # Keep a successfully built test APK even if independent Python checks failed.
        # Never upload a failed or incomplete Android build.
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' && steps.apk_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ax8pro-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Preserve lint diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/problems/
            python-regressions.log
            android-build.log
            android-lint.log
            apk-integrity.log
            apk-badging.log
            apk-signature.log
          if-no-files-found: ignore
          retention-days: 7
