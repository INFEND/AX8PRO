name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Avoid stale verification runs competing for runner time on rapid pushes.
concurrency:
  group: android-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Python regression checks
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tools -p 'test_*.py' -v 2>&1 | tee python-regressions.log
      - name: Compile debug APK and run lint
        # Run independently of Python regression failures so both diagnostics are available.
        # Still respect cancellation; do not waste runner time after a cancelled run.
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug 2>&1 | tee android-build.log
      - name: Preserve debug APK for verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ax8pro-debug-test-only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Preserve lint diagnostics on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
            app/build/reports/problems/
            python-regressions.log
            android-build.log
          if-no-files-found: ignore
          retention-days: 7
