name: Android verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Python regression checks
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Compile debug APK and run lint
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
