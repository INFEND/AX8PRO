plugins { id 'com.android.application' }

android {
    namespace 'ru.xarkon.ax8'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.xarkon.ax8pro'
        minSdk 26
        targetSdk 35
        versionCode 105
        versionName '1.5.87'
    }
    // GitHub Actions signs release APK with the permanent AX8PRO key.
    // Debug builds use the normal local debug signer only for development.
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Generate a verified local font resource before aapt runs; the APK itself
// contains the font and never needs internet to render the interface.
def tekturOutput = layout.buildDirectory.file("generated/tektur/res/font/tektur_variable.ttf")
android.sourceSets.main.res.srcDir(layout.buildDirectory.dir("generated/tektur/res"))
def prepareTektur = tasks.register("prepareTektur", Exec) {
    inputs.file(rootProject.file("scripts/prepare_tektur.py"))
    outputs.file(tekturOutput)
    commandLine "python3", rootProject.file("scripts/prepare_tektur.py").absolutePath,
        "--output", tekturOutput.get().asFile.absolutePath
}
tasks.configureEach {
    if (name == "preBuild") dependsOn(prepareTektur)
}
